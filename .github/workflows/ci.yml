name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://wafer_user:wafer_password@localhost:5432/wafer_db?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: test-secret-at-least-32-characters-long
  JWT_ISSUER: wafer-auth
  JWT_AUDIENCE: wafer-api
  ACCESS_TOKEN_EXPIRES_IN: 15m
  REFRESH_TOKEN_EXPIRES_IN: 7d

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wafer_user
          POSTGRES_PASSWORD: wafer_password
          POSTGRES_DB: wafer_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wafer_user -d wafer_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      # 如果你是 Vitest，建議讓 test 產生 JUnit XML
      - name: Test
        run: |
          mkdir -p reports
          pnpm exec vitest run \
            --reporter=default \
            --reporter=junit \
            --outputFile=reports/junit.xml

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Unit Tests
          path: reports/junit.xml
          reporter: jest-junit
          use-actions-summary: true
          fail-on-error: false

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

      - name: Build app
        run: pnpm build

      - name: Build Docker image
        run: docker build -t wafer-scheduling-next:ci .

      - name: CI Summary
        if: ${{ always() }}
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Node: \`24\`" >> $GITHUB_STEP_SUMMARY
          echo "- Package manager: \`pnpm 11.0.9\`" >> $GITHUB_STEP_SUMMARY
          echo "- Database: PostgreSQL 17" >> $GITHUB_STEP_SUMMARY
          echo "- Cache: pnpm" >> $GITHUB_STEP_SUMMARY
