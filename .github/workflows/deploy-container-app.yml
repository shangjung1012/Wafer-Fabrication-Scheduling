name: Deploy Container App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-wafer-dev
  AZURE_CONTAINER_APP: waferdev-web
  ACR_NAME: waferdev
  ACR_LOGIN_SERVER: waferdev.azurecr.io
  IMAGE_NAME: wafer-scheduling-next

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build image
        run: |
          docker build \
            --tag "${{ steps.image.outputs.image }}" \
            --tag "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.image }}"
          docker push "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --image "${{ steps.image.outputs.image }}"

      - name: Show deployment status
        run: |
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query "{name:name,runningStatus:properties.runningStatus,latestRevisionName:properties.latestRevisionName,latestRevisionFqdn:properties.latestRevisionFqdn,image:properties.template.containers[0].image}" \
            --output table
