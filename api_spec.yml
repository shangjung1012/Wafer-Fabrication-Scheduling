openapi: 3.0.3
info:
  title: 工廠訂單管理排程系統 API (Factory Order Management API)
  description: 提供訂單管理、排程調整、權限控制及視覺化功能之 API 介面規格。對應於專案的 Functional Requirements。
  version: 1.0.0
servers:
  - url: /api
    description: 主要 API 伺服器（Next.js App Router）
security:
  - bearerAuth: []
paths:
  # ==========================================================
  # Auth API (FR-01: 使用者註冊、登入)
  # ==========================================================
  /auth/register:
    post:
      summary: 使用者自助註冊（已停用）
      description: 三種角色皆不可自行註冊；請由 SUPERADMIN 建立邀請。
      tags:
        - Auth
      security: []
      responses:
        "403":
          description: 自助註冊已停用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      summary: 使用者登入
      description: 使用 username 或 email 搭配 password 進行登入，回傳 JWT access token 與 DB-backed refresh token。支援登入失敗鎖定機制。
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: username 或 email
                password:
                  type: string
      responses:
        "200":
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          $ref: "#/components/responses/Locked"

  /auth/refresh:
    post:
      summary: 更新 Access Token
      description: 使用 refresh token 換發新的 access token 與 refresh token；舊 refresh token 會撤銷。
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      summary: 使用者登出
      description: 撤銷指定 refresh token。
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /auth/invitations/verify:
    get:
      summary: 驗證邀請連結
      description: 檢查 180 秒邀請 token 是否仍有效，供設定密碼頁顯示受邀者資訊。
      tags:
        - Auth
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 邀請有效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/invitations/accept:
    post:
      summary: 接受邀請並設定密碼
      description: 受邀者在 180 秒內設定 username 與 password，完成帳號啟用。
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationInput"
      responses:
        "200":
          description: 設定成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  # ==========================================================
  # Orders API (FR-03, FR-04: 訂單檢視、匯入/修改/刪除)
  # ==========================================================
  /orders:
    get:
      summary: 取得訂單清單
      description: 依權限查看訂單清單，提供篩選、搜尋。
      tags:
        - Orders
      parameters:
        - name: factoryId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: keyword
          in: query
          schema:
            type: string
            description: 訂單名稱或類型搜尋
      responses:
        "200":
          description: 訂單清單
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: 建立訂單 (單筆)
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateInput"
      responses:
        "201":
          description: 建立成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    delete:
      summary: 批次刪除訂單 (軟刪除)
      description: 批次刪除多筆訂單，並觸發重新排程評估。
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: 刪除成功

  /orders/import:
    post:
      summary: 批次匯入訂單 (CSV)
      tags:
        - Orders
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 匯入結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  successCount:
                    type: integer
                  errorList:
                    type: array
                    items:
                      type: string

  /orders/{id}:
    get:
      summary: 取得單一訂單詳情
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 訂單詳情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    put:
      summary: 更新單一訂單
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdateInput"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ==========================================================
  # Order Requests API (FR-02: 業務提出插單/改單申請)
  # ==========================================================
  /requests:
    get:
      summary: 取得訂單申請清單
      description: 業務可檢視自己提出的申請，管理員可檢視負責工廠內的申請。
      tags:
        - Requests
      responses:
        "200":
          description: 申請清單
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderRequest"
    post:
      summary: 提出插單或改單申請
      tags:
        - Requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, message]
              properties:
                orderId:
                  type: string
                  description: 關聯的訂單 ID
                message:
                  type: string
                  description: 申請理由或說明
                payload:
                  type: object
                  description: 變更內容 (JSON)
      responses:
        "201":
          description: 申請建立成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRequest"

  /requests/{id}:
    put:
      summary: 修改尚未核准的申請
      tags:
        - Requests
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                payload:
                  type: object
      responses:
        "200":
          description: 申請更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRequest"

  /requests/{id}/approve:
    post:
      summary: 核准申請 (僅管理員可用)
      tags:
        - Requests
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已核准並套用變更

  # ==========================================================
  # Schedule API (FR-05: 管理員修改排程)
  # ==========================================================
  /schedule/run:
    post:
      summary: 執行排程引擎
      description: 手動或透過 Cron Job 觸發排程引擎。此操作具有分散式鎖定保護以避免併發衝突。支援傳入排程設定參數。
      tags:
        - Schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  description: 要執行排程的產品類型 (例如 'Type A')
                config:
                  $ref: "#/components/schemas/SchedulingConfig"
      responses:
        "200":
          description: 排程執行成功
        "400":
          description: 請求參數錯誤
        "401":
          description: 未授權
        "403":
          description: 權限不足 (需為 SUPERADMIN 或 ADMIN)
        "409":
          description: 該類型的排程正在執行中 (Locked)

  /schedule/preview:
    post:
      summary: 預覽排程變更 (甘特圖/衝突分析)
      description: |
        在實際生效前，預覽手動調整順序的影響範圍與衝突提示。
        產生 previewId 並暫存（TTL 1800 秒）於 Redis，供後續 `/schedule/apply` 使用。
        受 OCC（樂觀並行控制）保護：preview 會記錄當下的 schedule version，apply 時若 version 已變動則回 409。
      tags:
        - Schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  description: 要預覽排程的產品類型 (例如 'Type A')
                config:
                  $ref: "#/components/schemas/SchedulingConfig"
      responses:
        "200":
          description: 預覽結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  previewId:
                    type: string
                    description: 用於後續 `/schedule/apply` 的 preview 識別碼
                  data:
                    $ref: "#/components/schemas/SchedulePreviewResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /schedule/apply:
    post:
      summary: 確認並生效排程變更
      description: |
        套用先前 `/schedule/preview` 產生的排程結果到 DB。
        受 Redis 分散式鎖與樂觀並行控制（OCC）保護：
        - 若該類型已有其他排程作業執行中 → 409
        - 若 preview 期間 schedule version 已被推進 → 409（需重新 preview）
        - 若 previewId 已過期或不存在 → 404
      tags:
        - Schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [previewId]
              properties:
                previewId:
                  type: string
                  description: 由 `/schedule/preview` 回傳的 preview 識別碼
      responses:
        "200":
          description: 排程已生效更新，版本號推進
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Schedule applied successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: previewId 已過期或不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: NOT_FOUND
                message: Preview expired or not found
        "409":
          description: |
            OCC 失敗或鎖衝突：
            - 排程鎖已被其他作業持有
            - preview 期間 schedule version 已變動，需重新 preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: CONFLICT
                message: Schedule environment has changed. Please preview again.

  /schedule/notify:
    post:
      summary: 寄送衝突訂單通知信
      description: |
        針對 preview 階段被 kick out（排程衝突）的訂單，寄送通知信給訂單申請人 (applicant) 及所屬工廠管理員 (admin)。
        每個訂單可能產生 1~2 封信（applicant 與 admin 各一）。
      tags:
        - Schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orders]
              properties:
                orders:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/ConflictOrder"
      responses:
        "200":
          description: 通知寄送結果（部分成功亦回 200，以 sent/failed 分流）
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: array
                    description: 成功通知（至少寄出一封）的訂單 ID
                    items:
                      type: string
                  failed:
                    type: array
                    description: 所有相關信件皆失敗的訂單 ID
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ==========================================================
  # Users & Permissions API (FR-06: 管理員進行權限管理)
  # SUPERADMIN only — scoped to own production type (group)
  # ==========================================================
  /users:
    get:
      summary: 取得使用者清單
      description: |
        列出與目前 SUPERADMIN 相同 production type 的所有使用者。
        可選填 `role` query parameter 篩選角色。
      tags:
        - Permissions
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserRole"
          description: 依角色篩選（SUPERADMIN / ADMIN / SALES）
      responses:
        "200":
          description: 使用者清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      summary: 邀請使用者
      description: |
        SUPERADMIN 建立 pending user 並寄出 180 秒有效的設定密碼邀請信。
      tags:
        - Permissions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: 邀請建立成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/invitation/resend:
    post:
      summary: 重寄邀請信
      description: SUPERADMIN 可對尚未設定密碼的 pending user 重寄新的 180 秒邀請信。
      tags:
        - Permissions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 使用者 ID
      responses:
        "200":
          description: 重寄成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{id}:
    patch:
      summary: 修改使用者資料
      description: |
        更新使用者的 username、email、role 或 group。
        至少需提供一個欄位。目標使用者必須屬於相同 production type。
      tags:
        - Permissions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 使用者 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: 更新成功，回傳使用者 ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: 刪除使用者
      description: |
        刪除指定使用者。不可刪除自己。
        目標使用者必須屬於相同 production type。
      tags:
        - Permissions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 使用者 ID
      responses:
        "200":
          description: 刪除成功，回傳使用者 ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==========================================================
  # Visualization API (FR-07: 衝突或訂單變更視覺化)
  # ==========================================================
  /visualization/timeline:
    get:
      summary: 取得衝突或訂單變更視覺化資料
      description: 產生甘特圖、時間軸、變更 Diff 所需的渲染資料 (舊交期 vs 新交期、衝突區間)。
      tags:
        - Visualization
      parameters:
        - name: factoryId
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 視覺化與時間軸資料
          content:
            application/json:
              schema:
                type: object
                properties:
                  timeline:
                    type: array
                    items:
                      type: object
                  conflicts:
                    type: array
                    items:
                      type: object
                  diffs:
                    type: array
                    items:
                      type: object

# ==========================================================
# Components / Schemas
# ==========================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SchedulingConfig:
      type: object
      description: 排程引擎的設定參數
      properties:
        startDate:
          type: string
          format: date-time
          description: 排程起始日 (預設為 today + 1)
        endDate:
          type: string
          format: date-time
          description: 排程結束日 (預設無限制)
        frozenDays:
          type: integer
          description: 凍結天數 (預設 0)
          default: 0
        productionDays:
          type: integer
          description: 生產所需天數 (預設 1)
          default: 1
        bufferDays:
          type: integer
          description: 緩衝天數 (預設 0)
          default: 0
        reschedulePolicy:
          type: string
          enum: [GLOBAL_OPTIMIZE, PRIORITY_RETAIN, GAP_FILLING]
          description: 重排策略 (預設 GAP_FILLING)
          default: GAP_FILLING
        algorithm:
          type: string
          enum: [GREEDY_BEST_FIT]
          description: 排程演算法 (預設 GREEDY_BEST_FIT)
          default: GREEDY_BEST_FIT
        splittable:
          type: boolean
          description: 是否允許拆單 (預設 true)
          default: true
        targetOrderIds:
          type: array
          items:
            type: string
          description: 只針對這些訂單進行排程 (Targeted Scheduling)

    UserRole:
      type: string
      enum: [SUPERADMIN, ADMIN, SALES]

    FactoryStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    OrderStatus:
      type: string
      enum: [PENDING, SCHEDULED, IN_PRODUCTION, COMPLETED, CANCELLED, FAILED]

    AssignmentStatus:
      type: string
      enum: [SCHEDULED, IN_PRODUCTION, COMPLETED, CANCELLED]

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
          nullable: true
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        group:
          type: string

    Factory:
      type: object
      properties:
        id:
          type: string
        productionType:
          type: string
        adminId:
          type: string
        status:
          $ref: "#/components/schemas/FactoryStatus"

    Order:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        dueDate:
          type: string
          format: date-time
        quantity:
          type: integer
        applicantId:
          type: string
        name:
          type: string
        type:
          type: string
          description: Production type (A | B | C), auto-assigned from the caller's scope
        isFixed:
          type: boolean
        isPrioritized:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastModifiedById:
          type: string
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/OrderAssignment"

    OrderAssignment:
      type: object
      description: A dispatched sub-order assigned to a specific factory on a specific date
      properties:
        id:
          type: string
        orderId:
          type: string
        factoryId:
          type: string
        status:
          $ref: "#/components/schemas/AssignmentStatus"
        productionDate:
          type: string
          format: date-time
        assignedQuantity:
          type: integer

    OrderRequest:
      type: object
      properties:
        id:
          type: string
        applicantId:
          type: string
        orderId:
          type: string
        message:
          type: string
        payload:
          type: object

    OrderCreateInput:
      type: object
      required: [dueDate, quantity, name]
      properties:
        name:
          type: string
        quantity:
          type: integer
        dueDate:
          type: string
          format: date-time
        isFixed:
          type: boolean
        isPrioritized:
          type: boolean

    OrderUpdateInput:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: integer
        dueDate:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/OrderStatus"
        isFixed:
          type: boolean
        isPrioritized:
          type: boolean

    ScheduleUpdateInput:
      type: object
      properties:
        updates:
          type: array
          description: 多筆訂單的新生產時間或順序更新
          items:
            type: object
            required: [orderId, newProductionDate]
            properties:
              orderId:
                type: string
              newProductionDate:
                type: string
                format: date-time

    SchedulePreviewResult:
      type: object
      description: |
        排程預覽結果。`conflictOrderIds` 與 `conflictOrders` 用於前端顯示衝突訂單與寄送 kick-out 通知信。
      properties:
        newSchedule:
          type: array
          description: 預覽後的訂單清單（含每筆訂單預計的 assignments）
          items:
            $ref: "#/components/schemas/Order"
        affectedOrders:
          type: array
          items:
            type: string
            description: 受到影響的訂單 ID
        failedOrderIds:
          type: array
          items:
            type: string
            description: 未能排入排程的訂單 ID
        conflictWarnings:
          type: array
          items:
            type: string
            description: 衝突警告訊息
        conflictOrderIds:
          type: array
          nullable: true
          description: |
            排程衝突（kick out）的訂單 ID 清單。目前 preview route 主要回傳 `failedOrderIds`；
            `conflictOrderIds` 為將與前端 `/schedule/notify` 流程對齊的欄位（可能與 `failedOrderIds` 重疊或相同）。
          items:
            type: string
        conflictOrders:
          type: array
          nullable: true
          description: |
            衝突訂單的 hydrated 物件清單（含 applicant/admin email），可直接餵給 `/schedule/notify`。
            注意：目前 preview route 尚未實作 applicant + admin email hydration，將於後續任務補上；
            spec 先預留欄位以便前後端對齊。
          items:
            $ref: "#/components/schemas/ConflictOrder"

    ConflictOrder:
      type: object
      description: |
        排程衝突訂單的 hydrated 物件，供 `/schedule/notify` 寄送 kick-out 通知信使用。
      required: [id, name, applicantEmail, applicantUsername]
      properties:
        id:
          type: string
        name:
          type: string
        quantity:
          type: integer
        dueDate:
          type: string
          description: 訂單交期（ISO 8601 字串，與 notify route zod schema 對齊）
        applicantEmail:
          type: string
          format: email
          nullable: true
          description: 申請業務的 email；為 null 時不會寄信給 applicant
        applicantUsername:
          type: string
          nullable: true
        adminEmail:
          type: string
          format: email
          nullable: true
          description: 該訂單所屬工廠管理員的 email；為 null 時不會寄信給 admin
        adminUsername:
          type: string
          nullable: true

    CreateUserInput:
      type: object
      required: [email, role, group]
      properties:
        email:
          type: string
          format: email
          example: admin-a4@mail.shangjung.com
        role:
          $ref: "#/components/schemas/UserRole"
        group:
          type: string
          description: Production type (A / B / C)
          example: A

    InvitationCreateResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        group:
          type: string
        invitationExpiresAt:
          type: string
          format: date-time

    InvitationPreview:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        group:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time

    AcceptInvitationInput:
      type: object
      required: [token, username, password]
      properties:
        token:
          type: string
        username:
          type: string
          description: 受邀者自行設定的登入帳號（唯一）
        password:
          type: string

    UpdateUserInput:
      type: object
      description: 至少需提供一個欄位。
      properties:
        username:
          type: string
          description: 員編或登入帳號（唯一）
          example: admin-A4
        role:
          $ref: "#/components/schemas/UserRole"
        group:
          type: string
          nullable: true
          description: Production type (A / B / C)
          example: B
        password:
          type: string
          nullable: true
          description: 可選；提供時會以 Argon2id 重新雜湊儲存。

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: FORBIDDEN
        message:
          type: string
          example: You do not have permission to perform this action.
        details:
          type: object
          additionalProperties: true

  responses:
    Unauthorized:
      description: 未提供 token 或 token 無效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: UNAUTHORIZED
            message: Missing or invalid token

    Forbidden:
      description: 權限不足（role 或 scope 不符）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: FORBIDDEN
            message: "Role 'SALES' is not allowed. Required: SUPERADMIN."

    Conflict:
      description: 資源衝突，例如 username 已存在或角色不允許自助註冊
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: AUTH_CONFLICT
            message: Username is already registered.

    Locked:
      description: 帳號因登入失敗次數過多而暫時鎖定
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ACCOUNT_LOCKED
            message: Account is temporarily locked. Try again later.

    BadRequest:
      description: 請求格式錯誤或缺少必填欄位
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: BAD_REQUEST
            message: Invalid request body.

    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: NOT_FOUND
            message: User not found.
